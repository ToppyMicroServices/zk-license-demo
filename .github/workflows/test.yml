name: ZK license demonstration tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      REQUIRE_CRYPTO: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned real cryptographic backend
        run: python -m pip install --require-hashes -r requirements.txt
      - name: Policy and real cryptographic tests (missing backend is an error)
        run: python -W error -m unittest discover -s tests -v
      - name: Generate an actual proof and local report
        run: python demo.py run --out artifacts/ci-run
      - name: Independent verifier
        run: python demo.py verify --out artifacts/ci-run
      - name: Replay must fail for the expected reason
        shell: bash
        run: |
          if python demo.py verify --out artifacts/ci-run 2>artifacts/replay-error.txt; then
            echo 'ERROR: Replay accepted'
            exit 1
          fi
          grep -q already_used artifacts/replay-error.txt
